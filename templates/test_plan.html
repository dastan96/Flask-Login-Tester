<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Library</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="/static/css/styles.css">
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body class="test-library-page">
  <!-- Navbar (unchanged) -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
      <a class="navbar-brand" href="/">QA Lab</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
              aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav">
          <li class="nav-item">
            <a class="nav-link" href="/">Dashboard</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="/login">Login Demo</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="/test-plan">Test Library</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="/about">About</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="container test-library-shell">
    <section class="test-library-intro">
      <p class="section-kicker">QA Test Library</p>
      <h1>Test Suites</h1>
      <p>Browse the automated test suites and detailed test cases used to validate the application.</p>
    </section>

    <section id="testLibrarySuites" class="test-library-suites" aria-label="Automated test suites"></section>
  </main>

  <!-- Modal for selected test case details -->
  <div class="modal fade" id="testCaseModal" tabindex="-1" aria-labelledby="testCaseModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
      <div class="modal-content modal-card">
        <div class="modal-header">
          <h5 class="modal-title modal-title-bold test-case-modal-title" id="testCaseModalLabel"></h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body test-case-modal-body">
          <div class="modal-section">
            <i class="bi bi-check-circle-fill text-success"></i>
            <strong>Objective:</strong>
            <span id="modalObjective"></span>
          </div>
          <div class="modal-section">
            <i class="bi bi-exclamation-triangle-fill text-warning"></i>
            <strong>Preconditions:</strong>
            <span id="modalPreconditions"></span>
          </div>
          <div class="modal-section modal-section-muted">
            <i class="bi bi-file-earmark-text"></i>
            <strong>Test Data:</strong>
            <span id="modalTestData"></span>
          </div>
          <div class="modal-section steps-section modal-section-muted">
            <i class="bi bi-clipboard-check"></i>
            <strong>Steps:</strong>
            <ol id="modalSteps"></ol>
          </div>
          <div class="modal-section">
            <i class="bi bi-bullseye"></i>
            <strong>Expected Result:</strong>
            <span id="modalExpectedResult"></span>
          </div>
          <div class="modal-section">
            <i class="bi bi-lock"></i>
            <strong>Postconditions:</strong>
            <span id="modalPostconditions"></span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="footer-custom">
    <div class="container text-center">
      <a href="https://www.linkedin.com/in/dabbassian/" target="_blank" class="me-3" title="LinkedIn">
        <i class="bi bi-linkedin fs-3"></i>
      </a>
      <a href="https://github.com/dastan96" target="_blank" title="GitHub">
        <i class="bi bi-github fs-3"></i>
      </a>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/static/js/test_plan.js"></script>
</body>
</html>
