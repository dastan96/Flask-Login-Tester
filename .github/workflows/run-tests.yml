name: Run Automated Tests

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: '0 0 * * 0'  # Every Sunday at midnight (UTC)
  workflow_dispatch:  # Allows manual trigger as well

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      pytest_exit_code: ${{ steps.pytest.outputs.exit_code }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest and generate sanitized feed
        id: pytest
        run: |
          mkdir -p test-results public

          set +e
          python -m pytest \
            --ignore=tests/ui \
            --junitxml=test-results/junit.xml \
            --html=test-results/report.html \
            --self-contained-html
          PYTEST_EXIT_CODE=$?
          set -e

          python scripts/normalize_test_results.py \
            --junit test-results/junit.xml \
            --out-dir public \
            --branch "${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}" \
            --commit-sha "${GITHUB_SHA}" \
            --trigger "${GITHUB_EVENT_NAME}" \
            --workflow-run-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          echo "exit_code=${PYTEST_EXIT_CODE}" >> "${GITHUB_OUTPUT}"

      - name: Upload raw test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raw-test-reports
          path: |
            test-results/junit.xml
            test-results/report.html
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.pytest.outputs.exit_code == '0'
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Fail if tests failed
        if: always()
        run: |
          exit_code="${{ steps.pytest.outputs.exit_code }}"
          if [ -z "${exit_code}" ]; then
            exit 1
          fi
          if [ "${exit_code}" != "0" ]; then
            exit "${exit_code}"
          fi

  deploy-pages:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.test.outputs.pytest_exit_code == '0'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  ui-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run Playwright login UI tests
        run: python -m pytest tests/ui/test_login_ui.py --browser chromium
